# Error Messages
errors.found=Errors Found:

# Order Management - Order
order.error.id.invalid=id must be greater than 0.
order.error.notFound=Order not found.
order.error.notFoundById=Order not found for id {0}.
order.error.orderNumber.notBlank=orderNumber must not be null or blank.
order.error.orderNumber.pattern=orderNumber must follow the format ORD-0001.
order.error.customerId.notNull=customerId must not be null.
order.error.customerId.invalid=customerId must be greater than 0.
order.error.laundryId.notNull=laundryId must not be null.
order.error.laundryId.invalid=laundryId must be greater than 0.
order.error.promisedDate.notNull=promisedDate must not be null.
order.error.promisedDate.past=promisedDate must be a future date and time.
order.error.specialInstructions.size=specialInstructions must not exceed 500 characters.
order.error.items.notNull=items must not be null and must not contain null values.
order.error.items.empty=The order must have at least one item to be confirmed.
order.error.status.notDraft=The order can only be modified or confirmed while it is in DRAFT status.
order.error.status.notCancellable=The order can only be cancelled while it is in DRAFT or CONFIRMED status. Please contact the laundry.
order.error.cancellationReason.notBlank=reason must not be null or blank.
order.error.cancellationReason.size=reason must not exceed 255 characters.
order.error.query.filter.missing=Missing required parameter: customerId or laundryId.
order.error.query.filter.both=Only one parameter is allowed at a time: customerId or laundryId.

# Order Management - Order item
order.error.serviceId.invalid=serviceId must be greater than 0.
order.error.item.serviceId.notNull=serviceId must not be null.
order.error.item.garmentType.notNull=garmentType must not be null or blank.
order.error.item.garmentType.invalid=garmentType is not valid. Allowed values: SHIRT, PANTS, SUIT, BEDDING, DELICATE, BULK_LAUNDRY.
order.error.item.quantity.invalid=quantity must be greater than 0.
order.error.item.weightKg.invalid=weightKg must be greater than 0.
order.error.item.weightKg.digits=weightKg must have up to 6 integer digits and 2 decimals.
order.error.item.unitPrice.notNull=unitPrice must not be null.
order.error.item.unitPrice.invalid=unitPrice must be greater than 0.
order.error.item.unitPrice.digits=unitPrice must have up to 8 integer digits and 2 decimals.
order.error.item.currency.mismatch=The unit price must use the same currency as the order.
order.error.item.notes.size=notes must not exceed 255 characters.

# Order Management - Money
order.error.money.amount.notNull=amount must not be null.
order.error.money.amount.negative=amount must not be negative.
order.error.money.currency.notBlank=currency must not be null or blank.
order.error.money.currency.pattern=currency must be a three-letter ISO 4217 code, for example PEN.
order.error.money.currency.mismatch=Amounts with different currencies cannot be added.
order.error.money.factor.invalid=The multiplication factor must not be null or negative.
